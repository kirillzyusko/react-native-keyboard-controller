steps:
  - await:
      visible:
        id: chat.input
      timeout: 12000
  - await:
      idle: true
      timeout: 12000
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: Return
      timeoutMs: 12000
  - await:
      idle: true
      timeout: 12000
  - echo: Drag right, hold halfway, then reverse; expect the chat and keyboard to
      remain open.
  - tool: gesture-custom
    args:
      events:
        - type: Down
          x: 0.15
          y: 0.4
        - type: Move
          x: 0.55
          y: 0.4
          delayMs: 600
        - type: Move
          x: 0.55
          y: 0.4
          delayMs: 500
        - type: Move
          x: 0.16
          y: 0.4
          delayMs: 600
        - type: Up
          x: 0.16
          y: 0.4
          delayMs: 100
      interpolate: 24
  - await:
      visible:
        id: chat.input
      timeout: 12000
  - await:
      idle: true
      timeout: 12000
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: Return
      timeoutMs: 12000
  - await:
      idle: true
      timeout: 12000
executionPrerequisite: Back swipe chat and software keyboard are visible on iOS
  26.5 with the desired mode selected.
