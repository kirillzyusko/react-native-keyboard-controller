steps:
  - echo: Close is the default selection. Verify canceled and completed swipes with
      the same gesture used by the other policies.
  - launch:
      native: org.reactjs.native.example.KeyboardControllerFabricExample
      ios:
        app: org.reactjs.native.example.KeyboardControllerFabricExample
        args:
          - -RCT_jsLocation
          - localhost:8097
          - --issue243-trace
  - await:
      visible:
        id: back-swipe.open
      timeout: 30000
  - await:
      idle: true
      timeout: 12000
  - run: interactive-back-swipe-cycle.yaml
