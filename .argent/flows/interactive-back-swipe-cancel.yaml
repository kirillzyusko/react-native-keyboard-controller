steps:
  - echo:
      "Metro 8083 uses back-swipe-playground.metro.config.js. Close mode: focus
      the message input, cancel a full-screen native-stack pop and observe
      keyboard restoration."
  - launch:
      native: org.reactjs.native.example.KeyboardControllerFabricExample
      ios:
        app: org.reactjs.native.example.KeyboardControllerFabricExample
        args:
          - -RCT_jsLocation
          - localhost:8083
          - --issue243-trace
  - await:
      visible:
        id: back-swipe.open
      timeout: 30000
  - await:
      idle: true
      timeout: 12000
  - run: interactive-back-swipe-open-chat.yaml
  - run: interactive-back-swipe-active-cancel.yaml
