steps:
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Open debugger to view warnings.
      timeoutMs: 1500
  - echo: Dismiss the unlabeled React Native LogBox X. nativeID
      logbox_dismiss_button_warn is present in native-find-views but the flow
      runner cannot select it. Point is its native screenFrame center on
      iPhone 17 Pro, 402 by 874 points. Verify banner disappearance.
  - tool: gesture-tap
    args:
      x: 0.9203980099502488
      y: 0.9286804199559738
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        text: Open debugger to view warnings.
      timeoutMs: 3000
executionPrerequisite: FabricExample iPhone 17 Pro iOS 26.5 screen is visible and
  its existing LogBox warning banner is present over the input.
