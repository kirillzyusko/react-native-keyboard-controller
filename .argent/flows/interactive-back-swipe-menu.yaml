steps:
  - echo: "Prerequisite: Metro 8097 started with ARGENT_BACK_SWIPE_FULL_APP=1. Open
      the real FabricExample menu and enter the playground."
  - launch:
      native: org.reactjs.native.example.KeyboardControllerFabricExample
      ios:
        app: org.reactjs.native.example.KeyboardControllerFabricExample
        args:
          - -RCT_jsLocation
          - localhost:8097
          - --issue243-trace
  - await:
      visible:
        id: animated_transition
      timeout: 30000
  - await:
      idle: true
      timeout: 12000
  - echo: Scroll the new menu row away from the existing warnings toast, then open
      Interactive back swipe.
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.75
      toX: 0.5
      toY: 0.4
      durationMs: 400
      momentum: false
  - await:
      visible:
        id: interactive_back_swipe
      timeout: 12000
  - await:
      idle: true
      timeout: 12000
  - tap:
      id: interactive_back_swipe
  - await:
      visible:
        id: back-swipe.open
      timeout: 12000
  - await:
      idle: true
      timeout: 12000
  - echo: Open the real chat and change policies with the keyboard already visible.
  - run: interactive-back-swipe-open-chat.yaml
  - tap:
      id: back-swipe.chat.mode.none
  - run: interactive-back-swipe-active-cancel.yaml
  - tap:
      id: back-swipe.chat.mode.interactively
  - run: interactive-back-swipe-active-cycle.yaml
  - echo: Exit the nested playground with Back and verify the real Examples list
      returns.
  - tap:
      id: back-swipe.exit
  - await:
      hidden:
        id: back-swipe.open
      timeout: 6000
  - await:
      visible:
        id: interactive_back_swipe
      timeout: 12000
  - await:
      idle: true
      timeout: 12000
