steps:
  - await:
      visible:
        id: back-swipe.open
      timeout: 12000
  - await:
      idle: true
      timeout: 12000
  - tap:
      id: back-swipe.open
  - await:
      visible:
        id: chat.input
      timeout: 12000
  - await:
      idle: true
      timeout: 12000
  - when:
      visible:
        text: Open debugger to view warnings.
    steps:
      - run: interactive-back-swipe-dismiss-warning.yaml
  - tap:
      id: chat.input
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: Return
      timeoutMs: 12000
  - await:
      idle: true
      timeout: 12000
executionPrerequisite: Interactive back swipe Setup is visible on iOS 26.5 with
  the desired mode selected, in FabricExample or its diagnostic entry.
