steps:
  - launch:
      native: org.reactjs.native.example.KeyboardControllerFabricExample
      ios:
        app: org.reactjs.native.example.KeyboardControllerFabricExample
        args:
          - -RCT_jsLocation
          - localhost:8097
          - --issue243-trace
  - await:
      visible:
        id: back-swipe.open
      timeout: 12000
  - await:
      idle: true
      timeout: 12000
  - echo: Select interactively, then replay the same cancel/complete cycle used for
      none.
  - tap:
      id: back-swipe.setup.mode.interactively
  - run: interactive-back-swipe-cycle.yaml
