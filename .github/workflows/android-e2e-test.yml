name: 🛠 Android e2e tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-e2e-test.yml"
      - "package.json"
      - "android/**"
      - "example/**"
      - "e2e/**"
      - "src/**"
  push:
    branches:
      - main
      - codex/android-sticky-offset-race
      - codex/android-sticky-offset-fix
    paths:
      - ".github/workflows/android-e2e-test.yml"
      - "package.json"
      - "android/**"
      - "example/**"
      - "e2e/**"
      - "src/**"

permissions:
  contents: read
  actions: read

jobs:
  e2e-test:
    name: Android API 31 standard full suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WORKING_DIRECTORY: example
    concurrency:
      group: android-e2e-standard-31-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # force to remove default tools
          tool-cache: true
          # preserve Android
          android: false
      - name: Download a single artifact
        uses: actions/download-artifact@v4
        with:
          name: android-e2e-apk
          path: example/android/app/build/outputs/apk/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39947588356
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "yarn"
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "microsoft"
          java-version: "17"
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT
      - name: Restore node_modules from cache
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install root dependencies
        run: yarn install
      - name: Install e2e dependencies
        run: yarn install --cwd e2e
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-31-google_apis
      - name: Run emulator and tests
        uses: reactivecircus/android-emulator-runner@v2.33.0
        with:
          working-directory: e2e
          api-level: 31
          target: google_apis
          profile: pixel_2
          ram-size: "4096M"
          disk-size: "10G"
          disable-animations: false
          avd-name: e2e_emulator_31
          arch: x86_64
          script: SOFT_CHECK=true bash ../.github/scripts/android-api31-standard.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: android-api31-standard-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e/artifacts
