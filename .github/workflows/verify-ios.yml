name: ✨ Validate iOS

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-ios.yml"
      - "scripts/generate-ios-header.js"
      - "Package.swift"
      - "ios/**"
      - "example/.ruby-version"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-ios.yml"
      - "scripts/generate-ios-header.js"
      - "Package.swift"
      - "ios/**"
      - "example/.ruby-version"

concurrency:
  group: verify-ios-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  generated-header:
    runs-on: macos-26
    name: 📄 Generated Swift header
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      - name: Generate Swift header
        run: node scripts/generate-ios-header.js
      - name: Verify that the generated header hasn't changed
        run: git diff --exit-code HEAD -- ios/KeyboardControllerSwift.h
  swift-lint:
    runs-on: ubuntu-latest
    name: 🔎 Swift Lint
    steps:
      - uses: actions/checkout@v4
      - name: Run SwiftLint GitHub Action (--strict)
        uses: norio-nomura/action-swiftlint@master
        with:
          args: --strict
        env:
          WORKING_DIRECTORY: ios
  format:
    runs-on: macOS-15
    name: 📚 Swift Format
    defaults:
      run:
        working-directory: ./ios
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Format Swift code
        run: swiftformat --verbose .

      - name: Verify that the formatted code hasn't been changed
        run: git diff --exit-code HEAD
  objc-lint:
    runs-on: macOS-15
    name: 🔎 ObjC Lint
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify formatting
        run: yarn lint-clang
  unit-tests:
    name: 📖 Unit tests
    runs-on: macOS-15
    defaults:
      run:
        working-directory: ./ios/KeyboardControllerNative
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - name: List all available simulators
        run: xcrun simctl list

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: example

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Run unit tests
        run: "set -o pipefail && xcodebuild \
          test \
          -scheme KeyboardControllerNative \
          -only-testing KeyboardControllerNativeTests \
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5' \
          CODE_SIGNING_ALLOWED=NO | xcpretty"
