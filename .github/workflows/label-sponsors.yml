name: 💖 Label sponsors

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/label-sponsors.yml"
  pull_request_target:
    types: [opened, reopened]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label-sponsors:
    name: 💎 Label sponsor issues and pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Add sponsor label
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const label = "Sponsor 💖";
            const action = context.payload.action ?? "none";
            core.info(`Trigger: ${context.eventName} (action: ${action})`);

            let issues;
            if (
              context.eventName === "schedule" ||
              context.eventName === "workflow_dispatch" ||
              context.eventName === "pull_request"
            ) {
              issues = await github.paginate(
                github.rest.issues.listForRepo,
                {
                  ...context.repo,
                  state: "open",
                  per_page: 100,
                },
              );
            } else {
              const issueOrPullRequest =
                context.payload.issue ?? context.payload.pull_request;
              issues = issueOrPullRequest ? [issueOrPullRequest] : [];
            }

            core.info(`Loaded ${issues.length} open issue(s) and pull request(s)`);

            const sponsorQuery = `
              query($owner: String!, $repo: String!, $sponsor: String!) {
                repository(owner: $owner, name: $repo) {
                  owner {
                    ... on User {
                      isSponsoredBy(accountLogin: $sponsor)
                    }
                    ... on Organization {
                      isSponsoredBy(accountLogin: $sponsor)
                    }
                  }
                }
              }
            `;

            const sponsorStatus = new Map();
            const totals = {
              labeled: 0,
              noSponsor: 0,
              alreadyLabeled: 0,
              missingAuthor: 0,
            };

            for (const issue of issues) {
              const itemType =
                issue.pull_request ||
                context.payload.pull_request?.number === issue.number
                  ? "pull request"
                  : "issue";
              const author = issue.user?.login;
              const commentCount = issue.comments ?? 0;

              core.info(
                `Checking ${itemType} #${issue.number}: author=${author ?? "unknown"}, comments=${commentCount}`,
              );

              if (!author) {
                totals.missingAuthor += 1;
                core.info(`Skipped ${itemType} #${issue.number}: author is missing`);
                continue;
              }

              const alreadyLabeled = (issue.labels ?? []).some((issueLabel) =>
                typeof issueLabel === "string"
                  ? issueLabel === label
                  : issueLabel.name === label,
              );
              if (alreadyLabeled) {
                totals.alreadyLabeled += 1;
                core.info(
                  `Skipped ${itemType} #${issue.number}: ${label} is already applied`,
                );
                continue;
              }

              const participants = new Set([author]);

              if (commentCount > 0) {
                const comments = await github.paginate(
                  github.rest.issues.listComments,
                  {
                    ...context.repo,
                    issue_number: issue.number,
                    per_page: 100,
                  },
                );

                for (const comment of comments) {
                  if (comment.user?.login) {
                    participants.add(comment.user.login);
                  }
                }
              }

              core.info(
                `Participants in ${itemType} #${issue.number}: ${[...participants]
                  .map((participant) => `@${participant}`)
                  .join(", ")}`,
              );

              let sponsor;
              for (const participant of participants) {
                let cached = true;
                if (!sponsorStatus.has(participant)) {
                  cached = false;
                  const result = await github.graphql(sponsorQuery, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    sponsor: participant,
                  });
                  sponsorStatus.set(
                    participant,
                    result.repository.owner.isSponsoredBy,
                  );
                }

                const isSponsor = sponsorStatus.get(participant);
                core.info(
                  `Sponsor check for @${participant}: ${isSponsor ? "yes" : "no"}${
                    cached ? " (cached)" : ""
                  }`,
                );

                if (isSponsor) {
                  sponsor = participant;
                  break;
                }
              }

              if (!sponsor) {
                totals.noSponsor += 1;
                core.info(
                  `Skipped ${itemType} #${issue.number}: no participant is a sponsor`,
                );
                continue;
              }

              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issue.number,
                labels: [label],
              });
              totals.labeled += 1;
              core.info(
                `Added ${label} to ${itemType} #${issue.number}; ${sponsor} is a sponsor`,
              );
            }

            core.info(
              `Summary: scanned=${issues.length}, labeled=${totals.labeled}, ` +
                `no sponsor=${totals.noSponsor}, already labeled=${totals.alreadyLabeled}, ` +
                `missing author=${totals.missingAuthor}`,
            );

            await core.summary
              .addHeading("💖 Sponsor label scan")
              .addTable([
                [
                  { data: "Scanned", header: true },
                  { data: "Labeled", header: true },
                  { data: "No sponsor", header: true },
                  { data: "Already labeled", header: true },
                  { data: "Missing author", header: true },
                ],
                [
                  String(issues.length),
                  String(totals.labeled),
                  String(totals.noSponsor),
                  String(totals.alreadyLabeled),
                  String(totals.missingAuthor),
                ],
              ])
              .write();
